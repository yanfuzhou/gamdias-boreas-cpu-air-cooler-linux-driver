[package]
name = "gamdias-boreas-air-cooler-linux-driver"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "boreas"
path = "src/program.rs"

[dependencies]
hidapi = "2.6.6"
notify-rust = "4.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
