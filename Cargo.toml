[package]
name = "gamdias-boreas-air-cooler-linux-driver"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "program0"
path = "src/program0.rs"

[dependencies]
regex = "1.13.1"
walkdir = "2.5.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
chrono = "0.4.45"
hidapi = "2.6.6"
ctrlc = { version = "3.5.2", features = ["termination"] }
json5 = "1.3.1"
